<svg viewBox="0 0 850 230" width="100%" height="230" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0B12" />
      <stop offset="50%" stop-color="#131124" />
      <stop offset="100%" stop-color="#0B0B12" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B7FD6" />
      <stop offset="50%" stop-color="#E0A6C8" />
      <stop offset="100%" stop-color="#6FD6C1" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B7FD6" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#6FD6C1" stop-opacity="0.0" />
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#8B7FD6" stroke-width="0.6" stroke-opacity="0.08" />
    </pattern>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 32px;
      font-weight: 800;
      fill: #F5E6FF;
      letter-spacing: 3px;
    }
    .subtitle {
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 13.5px;
      fill: #C9B8F0;
      letter-spacing: 0.5px;
    }
    .cmd {
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 13px;
      fill: #6FD6C1;
    }
    .meta {
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 12px;
      fill: #7E769E;
    }
    .cursor {
      fill: #E0A6C8;
      animation: blink 1.1s step-end infinite;
    }
    .pulse-dot {
      fill: #6FD6C1;
      animation: pulse 2.4s ease-in-out infinite;
    }
    .float-orb {
      animation: float 6s ease-in-out infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 1; }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
  </style>

  <!-- Outer Card & Grid -->
  <rect width="850" height="230" rx="14" fill="url(#bg)" stroke="#262240" stroke-width="1.5" />
  <rect width="850" height="230" rx="14" fill="url(#grid)" />

  <!-- Ambient Glow Orb -->
  <circle class="float-orb" cx="730" cy="115" r="130" fill="url(#glow)" />

  <!-- Top Terminal Bar -->
  <path d="M 0 14 Q 0 0 14 0 L 836 0 Q 850 0 850 14 L 850 38 L 0 38 Z" fill="#161426" opacity="0.85" />
  <line x1="0" y1="38" x2="850" y2="38" stroke="#262240" stroke-width="1" />

  <!-- Window Controls -->
  <circle cx="24" cy="19" r="5.5" fill="#FF5F56" />
  <circle cx="44" cy="19" r="5.5" fill="#FFBD2E" />
  <circle cx="64" cy="19" r="5.5" fill="#27C93F" />
  <text x="425" y="23" text-anchor="middle" class="meta">lean@davao-ph: ~/workspace/portfolio</text>

  <!-- Live Status Indicator -->
  <circle class="pulse-dot" cx="765" cy="19" r="4" />
  <text x="777" y="23" class="meta" fill="#6FD6C1">ONLINE</text>

  <!-- Terminal Prompt Content -->
  <text x="45" y="75" class="cmd">❯ whoami --verbose</text>
  <text x="45" y="118" class="title">LEAN ADRIAN MURILLO</text>
  <rect x="45" y="132" width="190" height="3" rx="1.5" fill="url(#accent)" />

  <text x="45" y="162" class="subtitle">Full-Stack Engineer (Laravel · React)  //  Computer Vision Researcher</text>

  <text x="45" y="196" class="cmd">❯ location --current <tspan fill="#E0A6C8">"Davao City, Philippines"</tspan> <tspan fill="#8B7FD6">--status</tspan> <tspan fill="#F5E6FF">"Building & Shipping"</tspan></text>
  <rect class="cursor" x="638" y="184" width="8" height="15" />
</svg>