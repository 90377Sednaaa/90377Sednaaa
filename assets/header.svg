<svg viewBox="0 0 850 220" width="100%" height="220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0B12" />
      <stop offset="50%" stop-color="#141126" />
      <stop offset="100%" stop-color="#0B0B12" />
    </linearGradient>
    <linearGradient id="barGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B7FD6" />
      <stop offset="50%" stop-color="#E0A6C8" />
      <stop offset="100%" stop-color="#6FD6C1" />
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#8B7FD6" stroke-width="0.7" stroke-opacity="0.08" />
    </pattern>
  </defs>

  <!-- Background Card -->
  <rect width="850" height="220" rx="12" fill="url(#bg)" stroke="#262240" stroke-width="1.5" />
  <rect width="850" height="220" rx="12" fill="url(#grid)" />

  <!-- Top Window Bar -->
  <path d="M 0 12 Q 0 0 12 0 L 838 0 Q 850 0 850 12 L 850 36 L 0 36 Z" fill="#161426" />
  <line x1="0" y1="36" x2="850" y2="36" stroke="#262240" stroke-width="1" />

  <!-- Window Dots -->
  <circle cx="22" cy="18" r="5" fill="#FF5F56" />
  <circle cx="38" cy="18" r="5" fill="#FFBD2E" />
  <circle cx="54" cy="18" r="5" fill="#27C93F" />
  <text x="425" y="23" text-anchor="middle" font-family="monospace" font-size="12" fill="#7E769E">lean@terminal: ~/portfolio</text>

  <!-- Live Pulsing Status Dot (SMIL Native Animation) -->
  <circle cx="765" cy="18" r="4.5" fill="#6FD6C1">
    <animate attributeName="opacity" values="1;0.2;1" dur="2.2s" repeatCount="indefinite" />
  </circle>
  <text x="777" y="22" font-family="monospace" font-size="11" fill="#6FD6C1" font-weight="bold">ONLINE</text>

  <!-- Content -->
  <text x="40" y="75" font-family="monospace" font-size="13" fill="#6FD6C1">❯ whoami</text>
  <text x="40" y="112" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif" font-size="28" font-weight="800" fill="#F5E6FF" letter-spacing="2">LEAN ADRIAN MURILLO</text>
  <rect x="40" y="124" width="220" height="3" rx="1.5" fill="url(#barGradient)" />

  <text x="40" y="156" font-family="monospace" font-size="13.5" fill="#C9B8F0">Full-Stack Engineer (Laravel · React)  |  Computer Vision Researcher</text>

  <text x="40" y="188" font-family="monospace" font-size="12.5" fill="#8B7FD6">❯ status --location <tspan fill="#E0A6C8">"Davao City, PH"</tspan> <tspan fill="#7E769E">--state</tspan> <tspan fill="#F5E6FF">"Active"</tspan></text>

  <!-- Blinking Cursor (SMIL Native Animation) -->
  <rect x="525" y="176" width="7" height="15" fill="#E0A6C8">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
  </rect>
</svg>